<button class="back-btn-glass" (click)="back()">
  <span>←</span>
</button>
<div class="form-container">

  <h2>Add Amenity</h2>

  <form [formGroup]="amenityForm" (ngSubmit)="submit(this.amenityForm.value)">

    <div class="form-grid">

      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name" placeholder="Enter amenity name">
      </div>

      <div class="form-group">
        <label>Price per Hour (₹)</label>
        <input type="number" formControlName="pricePerHour">
      </div>

      <div class="form-group">
        <label>Capacity</label>
        <input type="number" formControlName="capacity">
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" formControlName="location">
      </div>

    </div>

    <div class="form-group full">
      <label>Description</label>
      <textarea formControlName="description" rows="3"></textarea>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Opening Time</label>
        <input type="number" formControlName="openingTime" placeholder="e.g. 6">
      </div>

      <div class="form-group">
        <label>Closing Time</label>
        <input type="number" formControlName="closingTime" placeholder="e.g. 22">
      </div>
    </div>

    <div class="form-group full">
      <label>Rules (comma separated)</label>
      <input type="text" formControlName="rules" placeholder="No smoking, No food">
    </div>

    <div class="form-actions">
      <button type="submit">@if(amenityId){Update Amenity}@else{Add Amenity}</button>
    </div>

  </form>

</div>
