<div class="otp-container">
  <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()" class="otp-card">

    <div class="otp-header">
      <span class="auth-badge">Security Check</span>
      <h2>Verify OTP</h2>
      <p class="subtitle">Enter the 6-digit code sent to your registered email</p>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <span class="material-icons input-icon">pin</span>
        <input 
          type="text"
          formControlName="otp"
          maxlength="6"
          placeholder="000000"
          class="otp-input"
        />
      </div>
      <small class="error-msg" *ngIf="otp?.invalid && (otp?.touched || otp?.dirty)">
        <span class="material-icons error-icon">error_outline</span> Enter a valid 6-digit verification code
      </small>
    </div>

    <button class="submit-btn" [disabled]="otpForm.invalid">
      <span>Verify Account</span>
      <span class="material-icons">arrow_forward</span>
    </button>

    <div class="resend-row">
      <p>Didn't receive the code? <button type="button" class="link-btn" (click)="resendOtp()">Resend OTP</button></p>
    </div>

  </form>
</div>
