<mat-toolbar class="navbar">

  <div class="nav-glow"></div>

  <div class="nav-left">
    <div class="logo">
      AmenityHub
      <span class="logo-badge">Society</span>
    </div>
  </div>

  @if(user){
    <div class="nav-center">
      <a class="nav-link" *ngIf="user?.role === 'USER'" routerLink="/home" routerLinkActive="active">Home</a>
      <a class="nav-link" *ngIf="user?.role === 'USER'" routerLink="/mybookings" routerLinkActive="active">Bookings</a>
      <a class="nav-link" *ngIf="user?.role === 'ADMIN'" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <div class="nav-indicator"></div>
    </div>
  }

  <div class="nav-right">
    <ng-container *ngIf="user; else guest">

      <!-- Profile Avatar Button -->
      <div class="profile" [matMenuTriggerFor]="menu">
        <div class="avatar">
          <span class="material-icons avatar-icon">person</span>
        </div>
      </div>

      <!-- Account Dropdown Menu Panel -->
      <mat-menu #menu="matMenu" class="custom-estate-menu">
        
        <!-- User Email Header -->
        <div class="menu-header">
          <span class="material-icons header-icon">account_circle</span>
          <div class="header-text">
            <span class="user-role-badge">{{ user?.role || 'RESIDENT' }}</span>
            <span class="user-email">{{ user?.email }}</span>
          </div>
        </div>

        <div class="menu-divider"></div>

        <!-- Links -->
        <button mat-menu-item routerLink="/home" *ngIf="user?.role === 'USER'" class="menu-item">
          <span class="material-icons item-icon">home</span>
          <span class="item-label">Home</span>
        </button>

        <button mat-menu-item routerLink="/mybookings" *ngIf="user?.role === 'USER'" class="menu-item">
          <span class="material-icons item-icon">event_available</span>
          <span class="item-label">My Bookings</span>
        </button>

        <button mat-menu-item routerLink="/dashboard" *ngIf="user?.role === 'ADMIN'" class="menu-item">
          <span class="material-icons item-icon">space_dashboard</span>
          <span class="item-label">Admin Dashboard</span>
        </button>

        <button mat-menu-item routerLink="/change-password" class="menu-item">
          <span class="material-icons item-icon">lock_reset</span>
          <span class="item-label">Change Password</span>
        </button>

        <div class="menu-divider"></div>

        <button mat-menu-item (click)="logout()" class="menu-item logout-item">
          <span class="material-icons item-icon logout">logout</span>
          <span class="item-label logout">Logout</span>
        </button>

      </mat-menu>

    </ng-container>

    <ng-template #guest>
      <button class="btn ghost" routerLink="/login">Login</button>
      <button class="btn primary" routerLink="/register">Register</button>
    </ng-template>
  </div>

</mat-toolbar>
