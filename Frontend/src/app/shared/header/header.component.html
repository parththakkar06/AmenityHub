<mat-toolbar class="navbar">

  <!-- Glow layer -->
  <div class="nav-glow"></div>

  <!-- Left -->
  <div class="nav-left">
    <div class="logo">Amenity Hub</div>
  </div>

  <!-- Center -->
   @if(user){
  <div class="nav-center" >

    <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
    <a class="nav-link" routerLink="/mybookings" routerLinkActive="active">Bookings</a>
    <!-- 
        -->
    <a class="nav-link"  routerLink="/admin/dashboard" routerLinkActive="active">
      Dashboard
    </a>

    <!-- Moving indicator -->
    <div class="nav-indicator"></div>

  </div>
}
  <!-- Right -->
  <div class="nav-right">

    <ng-container *ngIf="user; else guest">

      <div class="profile" [matMenuTriggerFor]="menu">
        <div class="avatar"></div>
      </div>

      <mat-menu #menu="matMenu">
        <button mat-menu-item>{{user?.email}}</button>
        <button mat-menu-item routerLink="/profile">Profile</button>
        <button mat-menu-item routerLink="/change-password">Change Password</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>

    </ng-container>

    <ng-template #guest>
      <button class="btn ghost" routerLink="/login">Login</button>
      <button class="btn primary" routerLink="/register">Register</button>
    </ng-template>

  </div>

</mat-toolbar>
